name: Publicar en GitHub Pages

# Requiere: Settings → Pages → Source = «GitHub Actions»
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests unitarios
        run: npm test -- --watch=false

      # La web vive en https://<usuario>.github.io/<repo>/
      - name: Build de producción
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages no sabe de rutas de Angular: /hyrox respondería 404. Con 404.html = index.html
      # la app arranca igualmente y el router abre la pantalla pedida
      - name: Rutas de la SPA
        run: cp dist/gym-log/browser/index.html dist/gym-log/browser/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/gym-log/browser

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
